async function checkAccess(){let p=norm(accessPhone.value),m=accessMonth.value;if(!m)return alert('請選擇月份');busy(true);try{let r=await rpc('check_booking_access',{p_phone:p,p_booking_month:m+'-01'});if(!r.allowed)return alert(r.message||'目前無法預約');C.phone=p;C.bookingMonth=m;C.accessType=r.access_type;C.step=4;C.available=await rpc('get_available_slots',{p_from:m+'-01',p_to:lastDateOfMonth(m)});renderCust()}catch(e){alert('連線失敗：'+e.message)}finally{busy(false)}}
function lastDateOfMonth(m){let [y,mo]=m.split('-').map(Number);return `${y}-${String(mo).padStart(2,'0')}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`}
function availByDate(d){return (C.available||[]).filter(s=>s.work_date===d)}function openDates(){return [...new Set((C.available||[]).map(s=>s.work_date))].sort()}

 const show=(msg,ok=false)=>{status.textContent=msg;status.classList.remove('hidden','ok','warn');status.classList.add(ok?'ok':'warn')};

 if(!email||!password)return show('請先輸入 Email 與密碼。');
 show('正在連線 Supabase…');btn.disabled=true;
 try{
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);

function bookDate(b){return b.working_slots?.working_days?.work_date||''}function bookStart(b){return tm(b.working_slots?.start_time)}function activeBook(b){return ['booked','completed'].includes(b.status)}
function renderCalendar(){let y=viewMonth.getFullYear(),m=viewMonth.getMonth();if(calendarMode==='agenda')return renderAgenda(y,m);let first=new Date(y,m,1),last=new Date(y,m+1,0),cells='';['日','一','二','三','四','五','六'].forEach(x=>cells+=`<div class="dow">${x}</div>`);for(let i=0;i<first.getDay();i++)cells+='<div></div>';for(let d=1;d<=last.getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,day=cache.days.find(x=>x.work_date===ds),books=cache.bookings.filter(b=>bookDate(b)===ds&&activeBook(b)).sort((a,b)=>bookStart(a).localeCompare(bookStart(b))),chips=books.slice(0,2).map(b=>`<div class="eventchip">${bookStart(b)} ${esc(b.customers?.name||'')}</div>`).join('');if(books.length>2)chips+=`<div class="eventchip">＋${books.length-2} 筆</div>`;cells+=`<div class="day ${day?.status||''} ${selectedDate===ds?'sel':''}" onclick="selectedDate='${ds}';renderCalendar()"><b>${d}</b>${day?.status==='holiday'?'<div class="muted">休</div>':chips||day?.status==='open'?`${chips}${!chips?'<div class="dot"></div>':''}`:''}</div>`}ownerContent.innerHTML=`<div class="topright"><button class="linkbtn" onclick="ownerLogout()">登出</button></div><div class="card"><div class="viewtoggle"><button class="on" onclick="calendarMode='month';renderCalendar()">月曆</button><button onclick="calendarMode='agenda';renderCalendar()">事項</button></div><div class="monthbar"><button onclick="changeOwnerMonth(-1)">‹</button><h3>${y} 年 ${m+1} 月</h3><button onclick="changeOwnerMonth(1)">›</button></div><div class="calendar">${cells}</div></div>${selectedDate?dayEditor(selectedDate):'<div class="card muted">點日期可設定營業時段與查看當日預約。</div>'}`}
async function changeOwnerMonth(n){viewMonth.setMonth(viewMonth.getMonth()+n);selectedDate='';await loadOwner();renderOwner()}
function renderAgenda(y,m){let last=new Date(y,m+1,0),html='';for(let d=1;d<=last.getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,books=cache.bookings.filter(b=>bookDate(b)===ds&&activeBook(b)).sort((a,b)=>bookStart(a).localeCompare(bookStart(b)));if(!books.length)continue;let wd=['日','一','二','三','四','五','六'][new Date(y,m,d).getDay()];html+=`<div class="agendaDay"><div class="agendaDate">${m+1}/${d}（${wd}）・${books.length} 筆預約</div>${books.map(b=>`<div class="agendaEvent" onclick="selectedDate='${ds}';calendarMode='month';renderCalendar()"><span class="agendaTime">${bookStart(b)}–${tm(b.working_slots?.end_time)}</span>　${esc(b.customers?.name||'')}<br><span class="muted">${b.service_type==='hand'?'手部':'足部'}｜${statusZh(b.status)}</span></div>`).join('')}</div>`}ownerContent.innerHTML=`<div class="topright"><button class="linkbtn" onclick="ownerLogout()">登出</button></div><div class="card"><div class="viewtoggle"><button onclick="calendarMode='month';renderCalendar()">月曆</button><button class="on" onclick="calendarMode='agenda';renderCalendar()">事項</button></div><div class="monthbar"><button onclick="changeOwnerMonth(-1)">‹</button><h3>${y} 年 ${m+1} 月事項</h3><button onclick="changeOwnerMonth(1)">›</button></div>${html||'<div class="muted">這個月目前沒有預約。</div>'}</div>`}
const statusZh=s=>({booked:'已預約',completed:'已完成',cancelled:'正常取消',late_cancel:'違規取消',no_show:'未到'})[s]||s;
function dayEditor(ds){let day=cache.days.find(x=>x.work_date===ds),slots=day?cache.slots.filter(s=>s.working_day_id===day.id):[],books=cache.bookings.filter(b=>bookDate(b)===ds);return `<div class="card"><h3>${ds}</h3><div class="seg"><button class="${day?.status==='open'?'on':''}" onclick="setDay('${ds}','open')">營業</button><button class="${day?.status==='holiday'?'on':''}" onclick="setDay('${ds}','holiday')">休假</button></div>${day?.status==='open'?`<h3 style="margin-top:16px">可預約時段</h3>${slots.map(s=>`<div class="slotrow"><span>${tm(s.start_time)}–${tm(s.end_time)}${s.status==='blocked'?' <span class="pill">封鎖</span>':''}</span><div><button class="ghost" onclick="toggleBlock('${s.id}','${s.status}')">${s.status==='blocked'?'解除':'封鎖'}</button> <button class="ghost" onclick="delSlot('${s.id}')">刪除</button></div></div>`).join('')||'<div class="muted">尚未新增時段</div>'}<label>新增時段</label><div class="timepick">${timeSelect('sh','sm')}<span>至</span>${timeSelect('eh','em')}</div><div class="muted" style="margin-top:6px">24 小時制；分鐘為 00、10、20、30、40、50。</div><button class="btn alt" onclick="addSlot('${day.id}')">＋ 新增時段</button><button class="btn alt" onclick="openCopyCalendar('${ds}')">複製這天時段到其他日期</button>`:''}</div><div class="card"><h3>當日預約</h3>${books.map(b=>`<div class="listitem"><b>${bookStart(b)}–${tm(b.working_slots?.end_time)}｜${esc(b.customers?.name||'')}</b> <span class="pill">${statusZh(b.status)}</span><div class="muted">${b.service_type==='hand'?'手部':'足部'}｜${esc(b.customers?.phone||'')}<br>${esc(b.design_note||'')}</div><div class="actions">${b.status==='booked'?`<button onclick="setBookingStatus('${b.id}','completed')">完成</button><button onclick="setBookingStatus('${b.id}','cancelled')">正常取消</button><button onclick="setBookingStatus('${b.id}','late_cancel')">違規取消</button><button onclick="setBookingStatus('${b.id}','no_show')">未到</button>`:''}</div></div>`).join('')||'<div class="muted">目前沒有預約</div>'}</div>`}
function timeSelect(hid,mid){let hs=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')),ms=['00','10','20','30','40','50'];return `<div class="row" style="gap:5px"><select id="${hid}">${hs.map(h=>`<option>${h}</option>`).join('')}</select><span style="flex:0">:</span><select id="${mid}">${ms.map(m=>`<option>${m}</option>`).join('')}</select></div>`}
async function setDay(ds,status){busy(true);try{let old=cache.days.find(x=>x.work_date===ds);if(old)await api(`/rest/v1/working_days?id=eq.${old.id}`,{method:'PATCH',body:{status},auth:true,headers:{Prefer:'return=minimal'}});else await api('/rest/v1/working_days',{method:'POST',body:{work_date:ds,status},auth:true,headers:{Prefer:'return=minimal'}});await loadOwner();renderCalendar()}catch(e){alert(e.message)}finally{busy(false)}}
async function addSlot(dayId){let start=sh.value+':'+sm.value,end=eh.value+':'+em.value;if(start>=end)return alert('結束時間需晚於開始時間');let existing=cache.slots.filter(s=>s.working_day_id===dayId);if(existing.some(x=>!(end<=tm(x.start_time)||start>=tm(x.end_time))))return alert('時段與既有時段重疊');busy(true);try{await api('/rest/v1/working_slots',{method:'POST',body:{working_day_id:dayId,start_time:start,end_time:end,status:'available'},auth:true,headers:{Prefer:'return=minimal'}});await loadOwner();renderCalendar()}catch(e){alert(e.message)}finally{busy(false)}}
async function delSlot(id){if(!confirm('確定刪除這個時段？已有預約時資料庫會阻止刪除。'))return;busy(true);try{await api(`/rest/v1/working_slots?id=eq.${id}`,{method:'DELETE',auth:true});await loadOwner();renderCalendar()}catch(e){alert('無法刪除：'+e.message)}finally{busy(false)}}async function toggleBlock(id,status){busy(true);try{await api(`/rest/v1/working_slots?id=eq.${id}`,{method:'PATCH',body:{status:status==='blocked'?'available':'blocked'},auth:true});await loadOwner();renderCalendar()}catch(e){alert(e.message)}finally{busy(false)}}
async function setBookingStatus(id,status){let extra='';if(['late_cancel','no_show'].includes(status))extra='\n\n之後可在「設定 → 優先資格」手動取消該客人下個月優先資格。';if(!confirm(`確定標記為「${statusZh(status)}」？${extra}`))return;busy(true);try{await api(`/rest/v1/bookings?id=eq.${id}`,{method:'PATCH',body:{status},auth:true});await loadOwner();renderCalendar()}catch(e){alert(e.message)}finally{busy(false)}}
let copyState=null;function openCopyCalendar(ds){let day=cache.days.find(x=>x.work_date===ds),slots=day?cache.slots.filter(s=>s.working_day_id===day.id):[];if(!slots.length)return alert('請先設定這一天的時段');let base=new Date(ds+'T00:00:00');copyState={source:ds,slots,year:base.getFullYear(),month:base.getMonth(),selected:new Set()};renderCopyModal()}function renderCopyModal(){document.getElementById('copyModal')?.remove();let c=copyState,y=c.year,m=c.month,first=new Date(y,m,1),last=new Date(y,m+1,0),html='';['日','一','二','三','四','五','六'].forEach(x=>html+=`<div class="copyhead">${x}</div>`);for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let d=1;d<=last.getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,src=ds===c.source;html+=`<button class="copyday ${src?'source':c.selected.has(ds)?'on':''}" ${src?'disabled':''} onclick="toggleCopyDate('${ds}')">${d}</button>`}let el=document.createElement('div');el.id='copyModal';el.className='modalbg';el.innerHTML=`<div class="modal"><h3>複製 ${c.source} 的時段</h3><div class="sub">直接點選要套用的日期，可一次選很多天。</div><div class="monthbar" style="margin-top:14px"><button onclick="changeCopyMonth(-1)">‹</button><b>${y} 年 ${m+1} 月</b><button onclick="changeCopyMonth(1)">›</button></div><div class="copycal">${html}</div><div class="muted" style="margin-top:12px">已選 ${c.selected.size} 天</div><button class="btn" onclick="applyCopyDates()">套用到選取日期</button><button class="btn alt" onclick="closeCopyCalendar()">取消</button></div>`;document.body.appendChild(el)}function toggleCopyDate(ds){copyState.selected.has(ds)?copyState.selected.delete(ds):copyState.selected.add(ds);renderCopyModal()}function changeCopyMonth(n){let d=new Date(copyState.year,copyState.month+n,1);copyState.year=d.getFullYear();copyState.month=d.getMonth();renderCopyModal()}function closeCopyCalendar(){document.getElementById('copyModal')?.remove();copyState=null}
async function applyCopyDates(){if(!copyState.selected.size)return alert('請至少選一個日期');if(!confirm(`確定套用到 ${copyState.selected.size} 天？已有時段的日期會先清除原時段。`))return;busy(true);try{for(let ds of copyState.selected){let day=(await api(`/rest/v1/working_days?select=*&work_date=eq.${ds}`,{auth:true}))[0];if(!day){let r=await api('/rest/v1/working_days',{method:'POST',body:{work_date:ds,status:'open'},auth:true,headers:{Prefer:'return=representation'}});day=r[0]}else{await api(`/rest/v1/working_days?id=eq.${day.id}`,{method:'PATCH',body:{status:'open'},auth:true});let existing=cache.slots.filter(s=>s.working_day_id===day.id);for(let s of existing){let has=cache.bookings.some(b=>b.slot_id===s.id&&activeBook(b));if(!has)await api(`/rest/v1/working_slots?id=eq.${s.id}`,{method:'DELETE',auth:true})}}for(let s of copyState.slots)await api('/rest/v1/working_slots',{method:'POST',body:{working_day_id:day.id,start_time:tm(s.start_time),end_time:tm(s.end_time),status:s.status},auth:true})}closeCopyCalendar();await loadOwner();renderCalendar();alert('複製完成')}catch(e){alert('複製失敗：'+e.message)}finally{busy(false)}}
function renderCustomers(){ownerContent.innerHTML=`<div class="topright"><button class="linkbtn" onclick="ownerLogout()">登出</button></div><div class="card"><h2>客戶</h2><div class="sub">依手機號碼辨識舊客；完成紀錄會自動影響未來優先資格。</div>${cache.customers.map(c=>{let bs=cache.bookings.filter(b=>b.customer_id===c.id),last=bs.sort((a,b)=>bookDate(b).localeCompare(bookDate(a)))[0];return `<div class="listitem"><b>${esc(c.name)}</b> <span class="pill">${bs.length} 筆</span><div class="muted">${esc(c.phone)}${last?`<br>最近：${bookDate(last)} ${last.service_type==='hand'?'手部':'足部'}｜${statusZh(last.status)}`:''}</div></div>`}).join('')||'<div class="muted">尚無客戶資料</div>'}</div>`}
function renderSettings(){let nowM=`${viewMonth.getFullYear()}-${String(viewMonth.getMonth()+1).padStart(2,'0')}`,set=cache.monthSettings.find(x=>x.booking_month===nowM+'-01');ownerContent.innerHTML=`<div class="topright"><button class="linkbtn" onclick="ownerLogout()">登出</button></div><div class="card"><h2>每月預約開放</h2><div class="sub">設定舊客優先與一般客的開放時間。</div><label>預約月份</label><input id="setMonth" type="month" value="${nowM}" onchange="renderSettingsForMonth(this.value)"><div id="monthSettingBox">${monthSettingHtml(set,nowM)}</div></div><div class="card"><h2>優先預約資格</h2><div class="sub">系統會自動看前兩個月「已完成」紀錄；這裡可手動給予或取消指定月份資格。</div><label>手機號碼</label><input id="prioPhone" placeholder="09xxxxxxxx"><label>預約月份</label><input id="prioMonth" type="month" value="${nowM}"><div class="grid"><button class="btn" onclick="saveOverride('grant')">手動給資格</button><button class="btn danger" onclick="saveOverride('deny')">取消資格</button></div>${cache.overrides.slice(0,20).map(o=>`<div class="listitem"><b>${esc(o.phone)}</b> <span class="pill">${o.mode==='grant'?'有資格':'停權'}</span><div class="muted">${o.booking_month}${o.reason?'｜'+esc(o.reason):''}</div><div class="actions"><button onclick="deleteOverride('${o.id}')">刪除人工設定</button></div></div>`).join('')}</div><div class="card"><h2>黑名單</h2><label>手機號碼</label><input id="bp" placeholder="09xxxxxxxx"><label>內部備註</label><input id="bn" placeholder="僅老闆看得到"><button class="btn" onclick="addBlack()">加入黑名單</button>${cache.blacklist.map(b=>`<div class="listitem"><b>${esc(b.phone)}</b> <span class="pill">${b.active?'封鎖中':'已解除'}</span><div class="muted">${esc(b.note||'')}</div><div class="actions"><button onclick="toggleBlack('${b.id}',${b.active})">${b.active?'解除':'重新封鎖'}</button></div></div>`).join('')}</div>`}
function monthSettingHtml(set,m){let p=set?toLocalInput(set.priority_open_at):'',g=set?toLocalInput(set.general_open_at):'';return `<label>舊客優先開放</label><input id="priorityAt" type="datetime-local" value="${p}"><label>一般預約開放</label><input id="generalAt" type="datetime-local" value="${g}"><button class="btn" onclick="saveMonthSetting('${m}')">儲存開放時間</button>`}function toLocalInput(v){if(!v)return'';let d=new Date(v),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}function renderSettingsForMonth(m){let set=cache.monthSettings.find(x=>x.booking_month===m+'-01');$('monthSettingBox').innerHTML=monthSettingHtml(set,m)}
async function saveMonthSetting(m){let p=priorityAt.value,g=generalAt.value;if(!p||!g)return alert('請填寫兩個開放時間');if(new Date(p)>=new Date(g))return alert('優先開放時間必須早於一般開放');busy(true);try{let body={booking_month:m+'-01',priority_open_at:new Date(p).toISOString(),general_open_at:new Date(g).toISOString()};let old=cache.monthSettings.find(x=>x.booking_month===m+'-01');if(old)await api(`/rest/v1/booking_month_settings?id=eq.${old.id}`,{method:'PATCH',body,auth:true});else await api('/rest/v1/booking_month_settings',{method:'POST',body,auth:true});await loadOwner();renderSettings();alert('已儲存')}catch(e){alert(e.message)}finally{busy(false)}}
async function saveOverride(mode){let phone=norm(prioPhone.value),m=prioMonth.value;if(!/^09\d{8}$/.test(phone)||!m)return alert('請輸入正確手機與月份');let reason=mode==='deny'?prompt('停權原因（僅後台看得到，可留空）')||'':prompt('備註（可留空）')||'';busy(true);try{let old=cache.overrides.find(o=>o.phone===phone&&o.booking_month===m+'-01'),body={phone,booking_month:m+'-01',mode,reason};if(old)await api(`/rest/v1/priority_overrides?id=eq.${old.id}`,{method:'PATCH',body,auth:true});else await api('/rest/v1/priority_overrides',{method:'POST',body,auth:true});await loadOwner();renderSettings()}catch(e){alert(e.message)}finally{busy(false)}}async function deleteOverride(id){if(!confirm('刪除這筆人工資格設定？刪除後會恢復系統自動判斷。'))return;await api(`/rest/v1/priority_overrides?id=eq.${id}`,{method:'DELETE',auth:true});await loadOwner();renderSettings()}
async function addBlack(){let p=norm(bp.value);if(!/^09\d{8}$/.test(p))return alert('請輸入正確手機號碼');busy(true);try{let old=cache.blacklist.find(x=>x.phone===p),body={phone:p,note:bn.value,active:true};if(old)await api(`/rest/v1/blacklist?id=eq.${old.id}`,{method:'PATCH',body,auth:true});else await api('/rest/v1/blacklist',{method:'POST',body,auth:true});await loadOwner();renderSettings()}catch(e){alert(e.message)}finally{busy(false)}}async function toggleBlack(id,active){await api(`/rest/v1/blacklist?id=eq.${id}`,{method:'PATCH',body:{active:!active},auth:true});await loadOwner();renderSettings()}
renderCust();
</script></body></html>
